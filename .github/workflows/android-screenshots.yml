name: Android screenshots

# Runs the app in demo mode on an emulator and saves Google Play screenshots
# (1080x1920) as the "android-screenshots-N" artifact.
on:
  workflow_dispatch:
  push:
    branches: [main, "screenshots/**", "feat/android-screenshots"]
    paths: ["app/**", "shared/**", ".github/workflows/android-screenshots.yml"]

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build app and test APKs
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Take screenshots on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb shell wm size 1080x1920
            adb shell wm density 420
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class com.jagajaga.calendarmap.ScreenshotTest me.jagajaga.calendarmap.test/androidx.test.runner.AndroidJUnitRunner | tee instrument.log
            mkdir -p screenshots
            adb pull /sdcard/Android/data/me.jagajaga.calendarmap/files/screenshots/. screenshots/ || true
            ls -la screenshots
            grep -q "OK (1 test)" instrument.log

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: android-screenshots-${{ github.run_number }}
          path: |
            screenshots
            instrument.log
          if-no-files-found: ignore

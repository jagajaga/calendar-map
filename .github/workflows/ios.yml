name: iOS

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ios:
    runs-on: macos-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Shared tests on the iOS simulator, then build Shared.xcframework
        run: ./gradlew --no-daemon :shared:iosSimulatorArm64Test :shared:assembleSharedReleaseXCFramework

      - name: Generate Xcode project
        if: hashFiles('ios/project.yml') != ''
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Pick a simulator
        if: hashFiles('ios/project.yml') != ''
        run: |
          xcodebuild -version
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if ".iOS-" not in runtime:
                  continue
              for d in devices[runtime]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit(0)
          sys.exit("no iPhone simulator")')
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices available | grep "$UDID"

      - name: Build and test (unit + UI tests, simulator)
        if: hashFiles('ios/project.yml') != ''
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project ios/CalendarMap.xcodeproj -scheme CalendarMap \
            -destination "id=$SIM_UDID" \
            -resultBundlePath build/CalendarMap.xcresult \
            CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | tee build/xcodebuild.log | grep -E "error:|warning: .*CalendarMap/|Test Case|Executed|\*\* (BUILD|TEST)" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build/xcodebuild.log

      - name: Export UI-test screenshots
        if: always() && hashFiles('build/CalendarMap.xcresult/Info.plist') != ''
        run: |
          mkdir -p build/screenshots
          xcrun xcresulttool export attachments --path build/CalendarMap.xcresult --output-path build/screenshots || true
          ls -la build/screenshots

      - uses: actions/upload-artifact@v5
        if: always() && hashFiles('ios/project.yml') != ''
        with:
          name: ios-screenshots-${{ github.run_number }}
          path: |
            build/screenshots
            build/xcodebuild.log
          if-no-files-found: ignore

  # Every commit to main goes to TestFlight once these repository secrets exist
  # (see store-listing/app-store.md): ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, APPLE_TEAM_ID.
  testflight:
    needs: ios
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Check App Store Connect secrets
        id: check
        env:
          KEY: ${{ secrets.ASC_KEY_P8 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$KEY" ] || [ -z "$TEAM" ]; then
            echo "::notice::App Store Connect secrets not set; skipping TestFlight upload."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.check.outputs.ok == 'true'

      - uses: actions/setup-java@v5
        if: steps.check.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5
        if: steps.check.outputs.ok == 'true'

      - name: Build Shared.xcframework and the Xcode project
        if: steps.check.outputs.ok == 'true'
        run: |
          ./gradlew --no-daemon :shared:assembleSharedReleaseXCFramework
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Archive and upload to TestFlight
        if: steps.check.outputs.ok == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY_PATH"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH"
                -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          mkdir -p build
          xcodebuild archive \
            -project ios/CalendarMap.xcodeproj -scheme CalendarMap -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/CalendarMap.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            "${AUTH[@]}" | tail -20
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/CalendarMap.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export \
            "${AUTH[@]}" | tail -20
          echo "Uploaded build $BUILD_NUMBER to App Store Connect; it appears in TestFlight after processing."

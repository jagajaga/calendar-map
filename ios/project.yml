# XcodeGen spec: `xcodegen generate` (run in ios/) creates CalendarMap.xcodeproj.
# The project needs ../shared/build/XCFrameworks/release/Shared.xcframework first:
#   ./gradlew :shared:assembleSharedReleaseXCFramework
name: CalendarMap
options:
  bundleIdPrefix: me.jagajaga
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  CalendarMap:
    type: application
    platform: iOS
    sources:
      - CalendarMap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.jagajaga.calendarmap
        PRODUCT_NAME: CalendarMap
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - framework: ../shared/build/XCFrameworks/release/Shared.xcframework
        embed: false
    info:
      path: CalendarMap/Info.plist
      properties:
        CFBundleDisplayName: Calendar Map
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes: [comgooglemaps]
        NSCalendarsFullAccessUsageDescription: Calendar Map reads your calendar events to place them on the map. Event titles and details stay on your device.
        NSLocationWhenInUseUsageDescription: Your location shows where you are on the map, how far events are, and is the starting point when you plan a route.
  CalendarMapTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CalendarMapTests
    dependencies:
      - target: CalendarMap
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: me.jagajaga.calendarmap.tests
  CalendarMapUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - CalendarMapUITests
    dependencies:
      - target: CalendarMap
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: me.jagajaga.calendarmap.uitests
        TEST_TARGET_NAME: CalendarMap
schemes:
  CalendarMap:
    build:
      targets:
        CalendarMap: all
        CalendarMapTests: [test]
        CalendarMapUITests: [test]
    test:
      targets:
        - CalendarMapTests
        - CalendarMapUITests
